name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
      - name: black
        run: black --check server/
      - name: flake8
        run: flake8 server/
      - name: mypy
        run: mypy

  test:
    # Installs Superdesk from the moving `develop` branch on purpose: this job is
    # an integration canary, so an upstream change in superdesk-core (or planning)
    # that breaks SAVA turns the build red and we find out immediately.
    name: Tests (against superdesk develop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System libraries for superdesk-core
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev
      - name: Install Superdesk (develop) + SAVA + test tooling
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/superdesk/superdesk-core.git@develop"
          pip install "git+https://github.com/superdesk/superdesk-planning.git@develop"
          pip install -e .
          pip install -r dev-requirements.txt
      - name: pytest
        run: pytest
